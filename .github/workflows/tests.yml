# The tests of a change request. This workflow runs the code of the change request, so it gets no
# secret. Its result is one input of the verdict; the verdict itself runs from the main branch.
name: tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run the quality checks of the contract on this code
        run: python3 scripts/charter_gate.py quality --contract charter.toml --repo-only
