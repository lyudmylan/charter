# The verdict on a change request. This workflow always runs from the main branch, with the scripts
# of the main branch. It never runs the code of the change request: it reads the files of the change
# request as data. It is the only workflow that holds a secret.
name: verdict

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Number of the change request"
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  verdict:
    name: verdict
    runs-on: ubuntu-latest
    steps:
      - name: Take the main branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Find the change request
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR: ${{ inputs.pr }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$INPUT_PR" ]; then
            python3 scripts/charter_facts_github.py find --repo "$GITHUB_REPOSITORY" --pr "$INPUT_PR" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/charter_facts_github.py find --repo "$GITHUB_REPOSITORY" --sha "$RUN_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Take the files of the change request, as data
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          path: change
          persist-credentials: false

      - name: Fetch the organization source into the cache, from the address in main
        env:
          CHARTER_ORG_TOKEN: ${{ secrets.CHARTER_ORG_TOKEN }}
        run: |
          set -e
          SOURCE=$(python3 scripts/charter_check.py source charter.toml) || { echo "$SOURCE"; exit 2; }
          readarray -t S <<< "$SOURCE"
          git clone --quiet "${S[0]/https:\/\//https://x-access-token:${CHARTER_ORG_TOKEN}@}" "${S[3]}"

      - name: Check the contract files of the change request, with the scripts of main
        id: contract
        run: |
          set +e
          python3 scripts/charter_check.py all change/charter.toml
          CODE=$?
          echo "result=$([ $CODE -eq 0 ] && echo success || echo failure)" >> "$GITHUB_OUTPUT"

      - name: Collect the facts of the change request, for the commit that the check describes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
          CONTRACT_RESULT: ${{ steps.contract.outputs.result }}
        run: >
          python3 scripts/charter_facts_github.py collect --repo "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER" --sha "$PR_SHA"
          --check "contract=$CONTRACT_RESULT"
          --check-run tests
          --out facts.json

      - name: Verdict
        id: verdict
        run: |
          set +e
          python3 scripts/charter_gate.py verdict --facts facts.json --contract charter.toml \
            --record record.json --scripts-version "$GITHUB_SHA" | tee verdict.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Put the evidence record on the change request
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          [ -s record.json ] && python3 scripts/charter_facts_github.py record --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --file record.json || echo "no record: the verdict could not run"

      - name: Publish the check "verdict" on the change request
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERDICT_CODE: ${{ steps.verdict.outputs.code }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          CONCLUSION=$([ "$VERDICT_CODE" = "0" ] && echo success || echo failure)
          TITLE=$(head -n 1 verdict.txt 2>/dev/null)
          [ -n "$TITLE" ] || TITLE="the verdict could not run"
          SUMMARY=$(cat verdict.txt 2>/dev/null)
          [ -n "$SUMMARY" ] || SUMMARY="the verdict could not run; see the log of the job"
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name=verdict -f head_sha="$PR_SHA" -f status=completed -f conclusion="$CONCLUSION" \
            -f "output[title]=$TITLE" -f "output[summary]=$SUMMARY" >/dev/null
          echo "$SUMMARY"
          [ "$CONCLUSION" = "success" ]
