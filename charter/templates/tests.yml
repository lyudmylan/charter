# The tests of a change request. This workflow runs the code of the change request, so it gets no
# secret. Its result is one input of the verdict; the verdict itself runs from the main branch.
# The scripts of Charter are fetched at the version that the contract names, outside the checkout.
name: tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    env:
      CHARTER_SCRIPTS: ${{ runner.temp }}/charter/charter/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch Charter at the version of the contract
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("charter.toml", "rb"))["charter"]["version"])')
          git clone --quiet --depth 1 --branch "charter--v$VERSION" %{charter_address} "$RUNNER_TEMP/charter"
      - name: Run the quality checks of the contract on this code
        run: python3 "$CHARTER_SCRIPTS/charter_gate.py" quality --contract charter.toml --repo-only
