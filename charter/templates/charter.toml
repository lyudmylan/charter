# Contract of this repo. The organization rules come from the source below.
# The checks: charter-check all charter.toml, and charter-gate quality --contract charter.toml
schema = 1

[repo]
name = %{repo}

# The organization source. This repo holds no copy of it.
[source]
address = %{source_address}
file = %{source_file}
version = %{source_version}

# The version of Charter that this repo uses. The workflows fetch Charter at the tag charter--v<version>.
[charter]
version = %{charter_version}

[tools]
issue_tracker = %{tracker}
code_host = %{host}
ci = %{ci}

# Who holds a role in this repo.
[roles]
leader = [%{leader}]
team_lead = [%{team_lead}]
engineer = [%{engineer}]
agent = [%{agent}]

# Risk tiers. The first tier whose paths match a file applies.
[tiers.high]
paths = [%{high_paths}]  # the contract, the rules, the approved intents, and the workflows
review = "deep"
approver = "leader"
approvals = 1

[tiers.low]
paths = ["**"]
review = "light"
approver = "engineer"
approvals = 1

# The review loop: a finding at this severity or above keeps the loop open. The limits come from the source.
[review]
threshold = "medium"

[documents]
necessary = ["docs/product.md"]
code_paths = [%{code_paths}]
text_checked = [%{text_checked}]   # they must contain none of the text-checked patterns

[instructions]
file = "AGENTS.md"

# Commands that must pass before a push. They run on the code of the change.
[checks]
quality = [%{quality}]

# The lifecycle map: the six phases of the AI-native SDLC playbook. In each: what does the work, which
# skill of Charter helps, and which built-in abilities of Claude Code the phase uses.
[lifecycle.plan]
work = "the leader with an agent: docs/product.md for the direction; the skill tracker for the issues and the intents"
builtin = ["plan mode"]

[lifecycle.design]
work = "the leader with an agent: the design spec of a work item, and docs/architecture.md kept current"
builtin = ["plan mode"]

[lifecycle.build]
work = "an agent on a branch, until the acceptance checks of the intent pass; the two checks before a push"
builtin = ["the Bash tool for the quality checks", "hooks"]

[lifecycle.test]
work = "the tests of the intent; the intent reviewer with the skill review-loop; a reviewer that is not the author"
builtin = ["/code-review", "/security-review", "claude plugin eval"]

[lifecycle.deploy]
work = "the verdict and the evidence record; the approver of the tier merges; a person decides production"
builtin = []

[lifecycle.maintain]
work = "a failure re-enters the cycle as an intent and ends as a check; each model upgrade runs the evals"
builtin = ["claude plugin eval"]
