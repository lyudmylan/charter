# The tests of a change request. This workflow runs the code of the change request, so it gets no
# secret. Its result is one input of the verdict; the verdict itself runs from the main branch.
# The scripts of Charter are fetched at the version that the contract names, outside the checkout.
name: tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The steps of the toolchain of this repo stand between the two marker lines. They run with no secret.
      # charter:toolchain:start
      - uses: pnpm/action-setup@v6      # the quality checks of this repo run with pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the packages of the change
        run: pnpm install --frozen-lockfile
      # charter:toolchain:end
      - name: Fetch Charter at the version of the contract
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("charter.toml", "rb"))["charter"]["version"])')
          git clone --quiet --depth 1 --branch "charter--v$VERSION" https://github.com/owner/charter "$RUNNER_TEMP/charter"
          echo "CHARTER_SCRIPTS=$RUNNER_TEMP/charter/charter/scripts" >> "$GITHUB_ENV"
      - name: Run the quality checks of the contract on this code
        run: python3 "$CHARTER_SCRIPTS/charter_gate.py" quality --contract charter.toml --repo-only

  # The product test of the contract, checks.product: it starts the product and tests it from the outside.
  # It runs the code of the change request, so it gets no secret, as the job tests.
  product:
    name: product
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The same steps of the toolchain as in the job tests. The setup step fills both blocks.
      # charter:toolchain:start
      - uses: pnpm/action-setup@v6      # the quality checks of this repo run with pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the packages of the change
        run: pnpm install --frozen-lockfile
      # charter:toolchain:end
      - name: Fetch Charter at the version of the contract
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("charter.toml", "rb"))["charter"]["version"])')
          git clone --quiet --depth 1 --branch "charter--v$VERSION" https://github.com/owner/charter "$RUNNER_TEMP/charter"
          echo "CHARTER_SCRIPTS=$RUNNER_TEMP/charter/charter/scripts" >> "$GITHUB_ENV"
      - name: Run the product test of the contract on this code
        run: python3 "$CHARTER_SCRIPTS/charter_gate.py" product --contract charter.toml --repo-only
