# Contract of this repo. The organization rules come from the source below.
# The checker: python3 charter/scripts/charter_check.py check charter.toml
schema = 1

[repo]
name = "charter"

# The organization source. This repo holds no copy of it.
[source]
address = "https://github.com/lyudmylan/charter-org"
file = "organization.toml"
version = "v1"

[tools]
issue_tracker = "github-issues"
code_host = "github"
ci = "github-actions"

# Who holds a role in this repo. One person holds all human roles today.
[roles]
leader = ["lyudmylan"]
team_lead = ["lyudmylan"]
engineer = ["lyudmylan"]
agent = ["claude-code"]

# Risk tiers. The first tier whose paths match a file applies.
[tiers.high]
paths = ["charter.toml", "charter/**", "tests/**", "intents/**", "AGENTS.md", ".github/**"]  # intents hold the approved acceptance checks
review = "deep"
approver = "leader"
approvals = 1

[tiers.low]
paths = ["**"]
review = "light"
approver = "engineer"
approvals = 1

# Limits that return control to a person.
[limits]
acceptance_loop = 3
review_loop = 3
refusals = 3

# The review loop: a finding at this severity or above keeps the loop open.
[review]
threshold = "medium"

# The Build phase: each work item has its plan, intents/<part>.plan.md, before the code.
[build]
plan_before_code = true

[documents]
necessary = ["docs/product.md"]
code_paths = ["charter/**"]
text_checked = ["README.md", "docs/product.md"]   # they must contain none of the text-checked patterns

[instructions]
file = "AGENTS.md"

# Commands that must pass before a push. They run on the code of the change.
# The contract checks (charter_check.py all charter.toml) run separately, with trusted scripts.
[checks]
quality = ["python3 -m unittest discover -s tests"]

# The lifecycle map: the six phases of the AI-native SDLC playbook. In each: what does the work, which
# skill of Charter helps, and which built-in abilities of Claude Code the phase uses. The template of
# the setup step (charter/templates/charter.toml) is the one list of the built-in abilities.
[lifecycle.plan]
work = "the leader with an agent: docs/product.md for the direction; the skill tracker for the issues and the intents"
builtin = ["plan mode"]

[lifecycle.design]
work = "the leader with an agent: the design spec of a work item; docs/contract.md as the map of this repo"
builtin = ["plan mode"]

[lifecycle.build]
work = "an agent on a branch, until the acceptance checks of the intent pass; the two checks before a push"
builtin = ["the Bash tool for the quality checks", "hooks"]

[lifecycle.test]
work = "the tests of the intent; the intent reviewer with the skill review-loop; a reviewer that is not the author"
builtin = ["/code-review", "/security-review", "claude plugin eval"]

[lifecycle.deploy]
work = "the verdict and the evidence record; the approver of the tier merges; the release is a tag of the plugins"
builtin = []

[lifecycle.maintain]
work = "a failure re-enters the cycle as an intent and ends as a check; each model upgrade runs the evals"
builtin = ["claude plugin eval"]
